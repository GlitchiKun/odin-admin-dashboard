<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav>
      <h1>Dashboard</h1>
      <ul class="main-nav">
        <li><a href="">Home</a></li>
        <li><a href="">Profile</a></li>
        <li><a href="">Messages</a></li>
        <li><a href="">History</a></li>
        <li><a href="">Tasks</a></li>
        <li><a href="">Communities</a></li>
      </ul>

      <ul class="miscellaneous-nav">
        <li><a href="">Settings</a></li>
        <li><a href="">Support</a></li>
        <li><a href="">Privacy</a></li>
      </ul>
    </nav>

    <header>
      <div class="searchbar">
        <label for="search">🔍</label>
        <input type="text" name="search" id="search" />
      </div>
      <div class="user-info">
          <a href="">🔔</a>
          <img
            class="small avatar"
            src="https://avatars.githubusercontent.com/u/47634123?s=400&u=36a0fe05272aed8aca33ce22db5500dca9021bfd&v=4"
            alt="Glichikun's avatar"
          />
          <div class="user">GlitchiKun</div>
        </div>
        <img
          class="big avatar"
          src="https://avatars.githubusercontent.com/u/47634123?s=400&u=36a0fe05272aed8aca33ce22db5500dca9021bfd&v=4"
          alt="Glichikun's avatar"
        />
      <div class="user-greeting">
        <div class="greeting">Hi there,</div>
        <div class="full-username">GlitchiKun @glitchikun</div>
      </div>
      <div class="header-buttons">
        <button>New</button>
        <button>Upload</button>
        <button>Share</button>
      </div>
    </header>
    <main></main>
  </body>
</html>
